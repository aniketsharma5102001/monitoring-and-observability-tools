name: FinTrack CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'charts/**'

jobs:
  lint-and-validate:
    name: Helm & YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint charts/fintrack/

  security-and-build:
    name: DevSecOps & Build
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. File System Scan (Catches misconfigurations and library vulnerabilities)
      - name: Run Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Build & Push using unique Git SHA tags 
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: true
          tags: aniketsharma05/fintrack-backend:${{ github.sha }}

      # 3. Final Container Scan before it is allowed in production
      - name: Run Trivy Vulnerability Scanner (Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aniketsharma05/fintrack-backend:${{ github.sha }}'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'