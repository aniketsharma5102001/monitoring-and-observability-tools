apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintrack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/aniketsharma5102001/monitoring-and-observability-tools.git'
    path: charts/fintrack
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: fintrack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true