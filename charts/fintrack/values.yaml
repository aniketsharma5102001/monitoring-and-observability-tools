backend:
  replicaCount: 2
  image:
    repository: aniketsharma05/fintrack-backend
    tag: "v1"
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

frontend:
  replicaCount: 2
  image:
    repository: aniketsharma05/fintrack-frontend
    tag: "v6"
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080

grafana:
  envFromSecret: "grafana-smtp-secret"
  grafana.ini:
    smtp:
      enabled: true
      host: "${GF_SMTP_HOST}"
      user: "${GF_SMTP_USER}"
      password: "${GF_SMTP_PASSWORD}"
      from_address: "${GF_SMTP_FROM_ADDRESS}"
      from_name: "${GF_SMTP_FROM_NAME}"
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
