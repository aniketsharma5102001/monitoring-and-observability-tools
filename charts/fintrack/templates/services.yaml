apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app.kubernetes.io/name: frontend-service
spec:
  type: NodePort  # Exposes port via k3s node 
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app.kubernetes.io/name: backend-service
spec:
  type: ClusterIP  # Internal cluster traffic only
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000