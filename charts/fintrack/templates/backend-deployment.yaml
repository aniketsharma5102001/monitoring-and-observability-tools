apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintrack-backend
  labels:
    app.kubernetes.io/name: fintrack-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: aniketsharma05/fintrack-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: AWS_REGION
          value: "us-east-1"
        - name: COGNITO_USER_POOL_ID
          value: "us-east-1_8NHtbe7Lf"
        - name: COGNITO_CLIENT_ID
          value: "7n3io96u9cbfv0s2fca9rr1lqn"
        envFrom:
        - secretRef:
            name: aws-keys
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
